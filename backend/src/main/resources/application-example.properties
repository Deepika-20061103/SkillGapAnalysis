spring.application.name=SkillMapAI-40

spring.datasource.url=jdbc:mysql://localhost:3306/skillmapai
spring.datasource.username=YOUR_DATABASE_USERNAME
spring.datasource.password=YOUR_DATABASE_PASSWORD

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

linkedin.client-id=YOUR_LINKEDIN_CLIENT_ID
linkedin.client-secret=YOUR_LINKEDIN_CLIENT_SECRET
linkedin.redirect-uri=http://localhost:8080/api/linkedin/callback

ollama.base-url=http://localhost:11434
ollama.model=llama3.2